<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="../js/page-boot.js"></script>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/diagnostics.css">
  <link rel="stylesheet" href="../assets/popup.css">
  <script src="../js/ui.js"></script>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand"><img src="../assets/icon.png" alt="" width="22" height="22"><span>__MSG_appName__</span></div>
      <div class="server-wrapper">
        <select id="serverSelect" class="server-select" aria-label="__MSG_menuServer__"></select>
        <span class="server-arrow" data-icon="chevron-down" aria-hidden="true"></span>
      </div>
    </header>
    <main class="content">
      <section class="domain-card" id="domainArea" aria-labelledby="currentDomain" aria-describedby="routingStatus" style="display:none;">
        <div id="domainHeading" class="domain-heading"><span id="statusIcon" class="status-icon" data-icon="route" aria-hidden="true"></span><div id="currentDomain" class="domain-text"></div><button id="routingDetailsBtn" class="info-button" type="button" aria-label="__MSG_popRoutingDetails__" aria-expanded="false" aria-controls="routingDetails"><span data-icon="info" aria-hidden="true"></span></button></div>
        <span id="routingStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
        <span id="pageLoadingState" class="loading-state" style="display:none;"></span>
        <div id="routingDetails" class="routing-details" hidden>
          <p id="routingDetailsText"></p>
          <p class="route-disclaimer">__MSG_popExpectedRoutingHint__</p>
          <p id="routingScopeText"></p>
        </div>
      </section>
      <section class="mode-section" aria-labelledby="modeLabel">
        <h2 id="modeLabel" class="section-label">__MSG_popModeLabel__</h2>
        <div class="mode-group segmented-control" role="group" aria-label="__MSG_popModeLabel__">
          <button type="button" class="mode-btn" id="mode-pac" aria-pressed="false" title="__MSG_popTitleAuto__">__MSG_popModeAuto__</button>
          <button type="button" class="mode-btn" id="mode-fixed" aria-pressed="false" title="__MSG_popTitleGlobal__">__MSG_popModeGlobal__</button>
          <button type="button" class="mode-btn" id="mode-direct" aria-pressed="false" title="__MSG_popTitleDirect__">__MSG_popModeDirect__</button>
          <button type="button" class="mode-btn" id="mode-system" aria-pressed="false" title="__MSG_popTitleSystem__">__MSG_popModeSystem__</button>
        </div>
        <p id="proxyControlMessage" class="rule-message error" role="status" aria-live="polite" style="display:none;"></p>
      </section>
      <section id="actionArea" class="site-section" aria-labelledby="siteRulesLabel" style="display:none;">
        <div class="section-heading"><h2 id="siteRulesLabel" class="section-label">__MSG_popSiteRulesLabel__</h2><span class="scope-caption">__MSG_popSiteScopeCompact__</span><button id="moreActionsBtn" class="more-toggle" type="button" aria-expanded="false" aria-controls="moreActions"><span>__MSG_popMoreActions__</span><span data-icon="chevron-down" aria-hidden="true"></span></button></div>
        <div class="site-actions">
          <div id="addBtnGroup" class="site-action-slot">
            <button id="addRuleBtn" class="btn-action btn-add" type="button" aria-pressed="false"><span data-icon="route" aria-hidden="true"></span><span id="proxyButtonLabel">__MSG_popBtnSiteProxy__</span></button>
          </div>
          <div id="whitelistArea" class="site-action-slot" style="display:none;">
            <button id="addWhitelistBtn" class="btn-action btn-whitelist" type="button" aria-pressed="false"><span data-icon="arrow-up-right" aria-hidden="true"></span><span id="whitelistButtonLabel"></span></button>
          </div>
        </div>
        <div class="rule-exception"><div class="rule-exception-copy"><p id="whitelistHint" class="rule-hint" style="display:none;"></p><p id="ruleScopeHint" class="rule-hint" style="display:none;"></p></div><button id="exceptionManageRulesBtn" class="btn-secondary" type="button" hidden>__MSG_popManageRuleCompact__</button></div>
        <div id="moreActions" class="site-secondary-actions" hidden>
          <button id="addTempRuleBtn" class="btn-secondary" type="button" title="__MSG_popBtnTempHint__"><span data-icon="clock" aria-hidden="true"></span><span>__MSG_popBtnTemp__</span></button>
          <button id="removeBtn" class="btn-secondary" type="button" style="display:none;"><span id="removeRuleIcon" data-icon="undo" aria-hidden="true"></span><span id="removeRuleLabel">__MSG_popBtnRemove__</span></button>
          <button id="removeWhitelistBtn" class="btn-secondary" type="button" style="display:none;"><span data-icon="undo" aria-hidden="true"></span><span>__MSG_popBtnRemoveDirectRule__</span></button>
          <button id="manageRulesBtn" class="btn-secondary" type="button"><span data-icon="list" aria-hidden="true"></span><span id="manageRulesLabel">__MSG_popBtnManageRule__</span></button>
        </div>
        <p id="whitelistMessage" class="rule-message" role="status" aria-live="polite" style="display:none;"></p>
      </section>
      <p id="operationMessage" class="rule-message" role="status" aria-live="polite" style="display:none;"></p>
    </main>
    <footer class="popup-footer">
      <button id="diagnosticsEntry" class="ps-diag ps-diag-entry" type="button" aria-controls="diagnosticsRoot">
        <span class="ps-diag-icon" data-icon="list" aria-hidden="true"></span>
        <span class="ps-diag-entry-copy"><span id="diagnosticsEntryTitle">Page requests</span><small id="diagnosticsEntryHint">View request domains and routing rules</small></span>
        <span class="ps-diag-icon" data-icon="chevron-right" aria-hidden="true"></span>
      </button>
      <button type="button" class="footer" id="openSettings"><span data-icon="settings" aria-hidden="true"></span><span>__MSG_popFooter__</span></button>
    </footer>
    <div id="diagnosticsHomeTrial" class="ps-diag home-trial"></div>
  </div>
  <section id="diagnosticsRoot" class="ps-diag" hidden></section>
  <script src="../js/utils.js"></script>
  <script src="../js/logger.js"></script>
  <script src="../js/routing.js"></script>
  <script src="../js/diagnostics-i18n.js"></script>
  <script src="../js/popup.js"></script>
  <script src="../js/diagnostics.js"></script>
</body>
</html>
